<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portaria - Busca</title>
  <link rel="stylesheet" href="/v1/style.css">
</head>
<body>
  <header>
    <a href="/v1/" class="marca"><span class="logo">P<i class="online"></i></span>Portaria</a>
    <nav class="nav">
      <a href="/v1/" class="ativo">Busca</a>
      <a href="/v1/cadastro-moradores.html">Cadastro</a>
      <a href="/v1/editar-moradores.html">Edição</a>
      <a href="/v1/detalhes-moradores.html">Detalhes</a>
      <a href="/v1/inativar-moradores.html">Inativação</a>
      <a href="/v1/movimentacao-veiculos.html">Movimentação</a>
      <a href="/v1/atualizacao-cadastro.html">Relatório</a>
      <a href="/v1/glossario.html">Ajuda</a>
    </nav>
    <h1>Portaria do Condomínio</h1>
    <p>Selecione o tipo de busca</p>
  </header>
  <div class="subbar"><span>Portaria · <strong>Busca</strong></span><span>v1</span></div>

  <main>
    <div class="opcoes">
      <button class="opcao ativa" data-tipo="morador">
        <span class="icone">👤</span>
        <span>Nome do Morador</span>
      </button>
      <button class="opcao" data-tipo="placa">
        <span class="icone">🚗</span>
        <span>Placa do Carro</span>
      </button>
      <button class="opcao" data-tipo="apto">
        <span class="icone">🚪</span>
        <span>Número do Apto</span>
      </button>
    </div>

    <form id="formBusca" autocomplete="off">
      <label for="campoBusca" id="rotulo">Nome do Morador</label>
      <div class="linha-busca">
        <input type="text" id="campoBusca" placeholder="Ex.: João Silva" required>
        <button type="submit">Buscar</button>
        <button type="button" id="limparPesquisa" class="botao-limpar">Limpar</button>
      </div>
    </form>

    <section id="dashboard" class="dashboard" aria-label="Resumo da portaria">
      <div class="dashboard-cabecalho">
        <div>
          <p class="eyebrow">Visão geral</p>
          <h2>Resumo da portaria</h2>
        </div>
        <span id="atualizadoEm" class="atualizado">Carregando...</span>
      </div>
      <div class="indicadores">
        <div class="indicador"><strong id="totalMoradores">-</strong><span>Moradores ativos</span></div>
        <div class="indicador"><strong id="totalProprietarios">-</strong><span>Proprietários</span></div>
        <div class="indicador"><strong id="totalLocatarios">-</strong><span>Locatários</span></div>
        <div class="indicador"><strong id="totalVeiculos">-</strong><span>Veículos</span></div>
        <div class="indicador indicador-destaque"><strong id="totalDentro">-</strong><span>Carros dentro</span></div>
      </div>
    </section>

    <section class="filtros-busca" aria-label="Filtros dos resultados">
      <label>Tipo<select id="filtroTipo"><option value="">Todos os tipos</option><option>Proprietário</option><option>Locatário</option><option>Outros</option></select></label>
      <label>Status<select id="filtroStatus"><option value="ativo">Ativos</option><option value="inativo">Inativos</option><option value="todos">Todos</option></select></label>
      <label class="filtro-placa">Veículo<select id="filtroVeiculo"><option value="">Todos</option><option value="Carro">Carros</option><option value="Moto">Motos</option><option value="sem">Sem veículo</option></select></label>
    </section>

    <section id="resultados"></section>
    <div id="paginacao" class="paginacao" aria-label="Paginação"></div>
  </main>

  <script src="/v1/script.js"></script>
</body>
</html>
