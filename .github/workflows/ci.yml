name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend frontend -type f -name '*.js' -print0)

      - name: Smoke test server
        run: |
          test_dir="$(mktemp -d)"

          cp -R backend frontend "$test_dir/"

          if [ -d data ]; then
            cp -R data "$test_dir/"
          else
            mkdir -p "$test_dir/data"
          fi

          PORT=3000 node "$test_dir/backend/server.js" &
          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$test_dir"' EXIT

          curl \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 15 \
            -fsS \
            http://127.0.0.1:3000/api/v1/moradores \
            > /dev/null

          curl \
            -fsS \
            http://127.0.0.1:3000/v1/editar-moradores.html \
            | grep -q 'id="limparEdicao"'

          echo "Smoke test concluído com sucesso."
