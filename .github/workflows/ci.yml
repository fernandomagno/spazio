name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend frontend -type f -name '*.js' -print0)

      - name: Smoke test server
        run: |
          test_dir="$(mktemp -d)"

          cp -R backend "$test_dir/"
          cp -R frontend "$test_dir/"

          mkdir -p "$test_dir/data"

          if [ -d data/fixtures ]; then
            mkdir -p "$test_dir/data/fixtures"
            cp -R data/fixtures/. "$test_dir/data/fixtures/"
          fi

          PORT=3000 node "$test_dir/backend/server.js" &
          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$test_dir"' EXIT

          echo "Aguardando backend iniciar..."

          curl \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 20 \
            -fsS \
            http://127.0.0.1:3000/api/v1/moradores \
            > /dev/null

          echo "Backend respondeu."

          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const fixturePath = 'data/fixtures/moradores.json';

            if (!fs.existsSync(fixturePath)) {
              console.log('Fixture não encontrada. Pulando validação de massa.');
              return;
            }

            const fixture = JSON.parse(
              fs.readFileSync(fixturePath, 'utf8')
            );

            const baseUrl = 'http://127.0.0.1:3000';

            const existentesResposta = await fetch(`${baseUrl}/api/moradores`);
            const existentes = await existentesResposta.json();

            if (existentes.length === 0) {
              for (const residente of fixture) {
                const { ativo, ...dados } = residente;

                const resposta = await fetch(`${baseUrl}/api/moradores`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                  throw new Error(
                    `Falha ao cadastrar fixture: HTTP ${resposta.status}`
                  );
                }

                const criado = await resposta.json();

                if (!ativo) {
                  const inativacao = await fetch(
                    `${baseUrl}/api/v1/moradores/${criado.id}`,
                    {
                      method: 'PATCH'
                    }
                  );

                  if (!inativacao.ok) {
                    throw new Error(
                      `Falha ao inativar fixture: HTTP ${inativacao.status}`
                    );
                  }
                }
              }
            } else {
              console.log(`Massa inicial já carregada: ${existentes.length} moradores.`);
            }

            const todosResposta = await fetch(
              `${baseUrl}/api/moradores`
            );

            const ativosResposta = await fetch(
              `${baseUrl}/api/v1/moradores`
            );

            if (!todosResposta.ok || !ativosResposta.ok) {
              throw new Error('Falha ao consultar moradores após carga.');
            }

            const todos = await todosResposta.json();
            const ativos = await ativosResposta.json();

            const totalVeiculos = todos.reduce(
              (total, residente) =>
                total + (residente.veiculos?.length || 0),
              0
            );

            console.log(
              `Validação concluída: ${todos.length} moradores, ` +
              `${ativos.length} ativos e ${totalVeiculos} veículos.`
            );
          }

          main().catch(erro => {
            console.error(erro);
            process.exit(1);
          });
          NODE

          echo "Validando frontend..."

          curl \
            -fsS \
            http://127.0.0.1:3000/v1/editar-moradores.html \
            | grep -q 'id="limparEdicao"'

          echo "Smoke test concluído com sucesso."
