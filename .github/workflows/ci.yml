name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend frontend -type f -name '*.js' -print0)

      - name: Smoke test server
        run: |
          PORT=3000 node backend/server.js &
          SERVER_PID=$!

          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          echo "Aguardando servidor..."

          curl \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 20 \
            -fsS \
            http://127.0.0.1:3000/api/v1/moradores \
            > /dev/null

          echo "API respondeu corretamente."

          curl \
            -fsS \
            http://127.0.0.1:3000/v1/editar-moradores.html \
            | grep -q 'id="limparEdicao"'

          echo "Frontend respondeu corretamente."

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Trigger Render Deploy
        run: |
          curl --fail --show-error --silent \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deployment triggered
        run: |
          echo "Deploy enviado para produção com sucesso."
